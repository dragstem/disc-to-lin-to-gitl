version: '3.8'

services:
  linear-gitlab-sync:
    build: .
    container_name: linear-gitlab-sync
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    volumes:
      # Persist application data and logs
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - sync-network

networks:
  sync-network:
    driver: bridge

volumes:
  sync-data:
    driver: local
  sync-logs:
    driver: local